<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="A2UI Hamming — Standalone thin client for agent-to-user interfaces">
  <link rel="manifest" href="manifest.json">
  <title>A2UI</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --dim: #808080;
      --accent: #4a9eff;
      --error: #ff4a4a;
      --success: #4aff6e;
      --font: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    .app {
      display: grid;
      grid-template-rows: 48px 1fr auto;
      height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 14px; font-weight: 600; }
    header .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--accent);
      color: #000;
      border-radius: 3px;
      font-weight: 700;
    }
    header .spacer { flex: 1; }
    header .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--dim);
    }
    header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
    }
    header .dot.connected { background: var(--success); }
    header .dot.connecting { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    main {
      overflow-y: auto;
      padding: 16px;
    }
    footer {
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    footer input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
    }
    footer input:focus { outline: none; border-color: var(--accent); }
    footer button {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #000;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    footer button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>A2UI</h1>
      <span class="badge">HAMMING</span>
      <div class="spacer"></div>
      <div class="status">
        <div class="dot" id="status-dot"></div>
        <span id="status-label">Disconnected</span>
      </div>
    </header>

    <main id="surfaces">
      <!-- A2UI surfaces render here -->
    </main>

    <footer>
      <input type="text" id="endpoint" placeholder="wss://agent.example.com/hamming" value="ws://localhost:8090/hamming">
      <button id="connect-btn">Connect</button>
    </footer>
  </div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
