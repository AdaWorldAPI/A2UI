[package]
name = "a2ui-hamming"
version = "0.1.0"
edition = "2021"
authors = ["AdaWorldAPI"]
description = "A2UI Hamming Protocol — bitpacked 10kbit codebook transport for agent-to-user interfaces"
license = "Apache-2.0"
repository = "https://github.com/AdaWorldAPI/A2UI"
keywords = ["a2ui", "hamming", "grpc", "bitpacked", "codebook"]

[features]
default = ["simd", "grpc"]
simd = []
grpc = ["tonic", "prost", "tokio"]
flight = ["arrow", "arrow-flight"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "serde-wasm-bindgen"]
cognitive = []          # ladybug-rs cognitive codebook integration
firefly = []            # firefly GEL execution graph integration
full = ["simd", "grpc", "flight", "cognitive", "firefly"]

[dependencies]
# Core
sha2 = "0.10"
hex = "0.4"
crc32fast = "1.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
lz4_flex = "0.11"

# gRPC (optional)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# Arrow Flight (optional)
arrow = { version = "53", optional = true }
arrow-flight = { version = "53", optional = true }

# WASM (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full", "test-util"] }

[[bench]]
name = "hamming_bench"
harness = false

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
